<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArbiMine • Crypto Arbitrage</title>
<style>
  :root {
    --green:#00A651; --green-dark:#007A3D; --green-light:#E6F7EE;
    --cream:#FDF6E3; --card:#FFFFFF;
    --text:#1F2937; --muted:#6B7280; --border:#E5E7EB;
    --danger:#DC2626; --danger-light:#FEE2E2;
    --warning:#D97706; --warning-light:#FEF3C7;
    --info:#2563EB; --info-light:#DBEAFE;
    --success:#059669; --success-light:#D1FAE5;
    --shadow:0 4px 12px rgba(0,0,0,.06);
    --shadow-lg:0 10px 30px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;line-height:1.5}

  /* AUTH */
  .auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:linear-gradient(135deg,#00A651 0%,#007A3D 100%)}
  .auth-card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:32px 24px;box-shadow:var(--shadow-lg)}
  .auth-card h1{font-size:1.5rem;margin-bottom:4px}
  .auth-card .sub{color:var(--muted);font-size:.85rem;margin-bottom:24px}
  .auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--cream);padding:4px;border-radius:10px}
  .auth-tabs button{flex:1;padding:10px;border:none;background:transparent;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer;font-size:.85rem}
  .auth-tabs button.active{background:#fff;color:var(--green-dark);box-shadow:var(--shadow)}

  /* FORM */
  .field{margin-top:14px}
  .field label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--cream);font-size:.95rem;font-weight:500;outline:none;font-family:inherit;transition:.15s}
  input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(0,166,81,.12)}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:16px;transition:.15s}
  .btn-primary{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;box-shadow:0 4px 14px rgba(0,166,81,.35)}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-secondary{background:var(--cream);color:var(--text);border:1.5px solid var(--border)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn-sm{width:auto;padding:8px 14px;font-size:.8rem;margin-top:0}
  .msg{font-size:.82rem;margin-top:12px;padding:10px;border-radius:8px;display:none}
  .msg.show{display:block}
  .msg.error{background:var(--danger-light);color:#7F1D1D}
  .msg.success{background:var(--success-light);color:#065F46}

  /* APP */
  .app{display:none;min-height:100vh;padding-bottom:80px}
  header{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:20px 20px 40px;position:relative;overflow:hidden}
  .header-inner{max-width:960px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
  .brand{display:flex;gap:12px;align-items:center}
  .brand-logo{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:18px}
  .brand h1{font-size:1.1rem;font-weight:700}
  .brand p{font-size:.75rem;opacity:.85}
  .logout-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 14px;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}

  .container{max-width:960px;margin:-20px auto 0;padding:0 16px;position:relative;z-index:2}

  /* TABS */
  .tabs{display:flex;gap:4px;background:#fff;border-radius:12px;padding:6px;box-shadow:var(--shadow);margin-bottom:20px;overflow-x:auto}
  .tab{flex:1;padding:10px 12px;border:none;background:transparent;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer;font-size:.82rem;font-family:inherit;white-space:nowrap}
  .tab.active{background:var(--green-light);color:var(--green-dark)}

  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px;margin-bottom:16px}
  .card h2{font-size:1rem;margin-bottom:12px;font-weight:700}

  /* SUB STATUS */
  .sub-bar{padding:14px 16px;border-radius:12px;font-size:.85rem;margin-bottom:16px;font-weight:600}
  .sub-bar.active{background:var(--success-light);color:#065F46}
  .sub-bar.inactive{background:var(--warning-light);color:#92400E}

  /* SCAN */
  .scan-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .scan-status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#9CA3AF}
  .dot.live{background:var(--success);box-shadow:0 0 0 0 rgba(5,150,105,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(5,150,105,.7)}70%{box-shadow:0 0 0 8px rgba(5,150,105,0)}100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}

  /* OPPORTUNITY */
  .opp{background:var(--cream);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
  .opp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .opp-symbol{font-size:1rem;font-weight:800}
  .spread{background:var(--success-light);color:#065F46;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:800}
  .opp-route{display:flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
  .opp-route .ex{background:#fff;padding:3px 8px;border-radius:6px;font-weight:600;color:var(--text)}
  .opp-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:8px}
  .opp-ai{margin-top:10px;padding:8px 10px;background:var(--info-light);border-radius:8px;font-size:.75rem;color:#1E3A8A}

  /* PLANS */
  .plans{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
  @media(min-width:600px){.plans{grid-template-columns:repeat(3,1fr)}}
  .plan{border:2px solid var(--border);border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:.15s}
  .plan:hover,.plan.selected{border-color:var(--green);background:var(--green-light)}
  .plan h3{font-size:.9rem;text-transform:uppercase;color:var(--muted);margin-bottom:8px;letter-spacing:.5px}
  .plan .price{font-size:1.6rem;font-weight:800;color:var(--green-dark)}
  .plan .dur{font-size:.78rem;color:var(--muted);margin-top:4px}

  /* PAYMENT STATUS */
  .pay-status{padding:14px;border-radius:10px;margin-top:14px;font-size:.85rem;display:none}
  .pay-status.show{display:block}
  .pay-status.pending{background:var(--warning-light);color:#92400E}
  .pay-status.success{background:var(--success-light);color:#065F46}
  .pay-status.failed{background:var(--danger-light);color:#991B1B}
  .pay-status .title{font-weight:700;margin-bottom:4px}

  /* MESSAGES */
  .msg-item{padding:12px;border-radius:10px;margin-bottom:8px;font-size:.85rem}
  .msg-item.admin{background:var(--info-light);border-left:3px solid var(--info)}
  .msg-item.user{background:var(--cream);border-left:3px solid var(--green)}
  .msg-item .meta{font-size:.7rem;color:var(--muted);margin-top:4px}
  .msg-input-row{display:flex;gap:8px;margin-top:12px}
  .msg-input-row input{flex:1}

  /* TX LIST */
  .tx{padding:12px;border-radius:10px;margin-bottom:8px;background:var(--cream);font-size:.82rem}
  .tx-top{display:flex;justify-content:space-between;margin-bottom:4px}
  .tx-ref{font-family:monospace;font-size:.72rem;color:var(--muted)}
  .badge{padding:2px 8px;border-radius:999px;font-size:.68rem;font-weight:800;text-transform:uppercase}
  .badge.success{background:var(--success-light);color:#065F46}
  .badge.failed{background:var(--danger-light);color:#991B1B}
  .badge.pending{background:var(--warning-light);color:#92400E}
  .reason{color:var(--danger);font-weight:600;font-size:.75rem;margin-top:4px}

  /* MODAL */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:20px;z-index:999}
  .modal.show{display:grid}
  .modal-card{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%}
  .modal-card h3{margin-bottom:12px}
  .modal-actions{display:flex;gap:8px;margin-top:16px}

  /* TOAST */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:500;z-index:1000;transition:.3s;max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--green-dark)}
  .toast.error{background:#991B1B}
</style>
</head>
<body>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>ArbiMine</h1>
    <p class="sub">Crypto arbitrage scanner & signals</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuth('login')">Login</button>
      <button id="tabRegister" onclick="switchAuth('register')">Register</button>
    </div>

    <div id="loginForm">
      <div class="field">
        <label>Username / Email / M-Pesa</label>
        <input id="loginId" type="text" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="loginPw" type="password" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Login</button>
    </div>

    <div id="registerForm" style="display:none">
      <div class="field"><label>Username</label><input id="regUser" type="text" /></div>
      <div class="field"><label>Email</label><input id="regEmail" type="email" /></div>
      <div class="field"><label>M-Pesa (07XXXXXXXX or 2547XXXXXXXX)</label><input id="regMpesa" type="tel" /></div>
      <div class="field"><label>Password</label><input id="regPw" type="password" /></div>
      <button class="btn btn-primary" onclick="doRegister()">Create Account</button>
    </div>

    <div id="authMsg" class="msg"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="app">
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">AM</div>
        <div>
          <h1>ArbiMine</h1>
          <p id="welcomeUser">Welcome</p>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div id="subBar" class="sub-bar inactive">Loading subscription…</div>

    <div class="tabs">
      <button class="tab active" data-tab="opportunities" onclick="switchTab('opportunities')">Opportunities</button>
      <button class="tab" data-tab="payments" onclick="switchTab('payments')">Payments</button>
      <button class="tab" data-tab="messages" onclick="switchTab('messages')">Messages</button>
      <button class="tab" data-tab="settings" onclick="switchTab('settings')">Settings</button>
    </div>

    <!-- OPPORTUNITIES TAB -->
    <div id="tab-opportunities" class="tab-panel">
      <div class="card">
        <h2>Arbitrage Scanner</h2>
        <div class="scan-row">
          <button id="startScanBtn" class="btn btn-primary btn-sm" onclick="startScan()">▶️ Start Scanning</button>
          <button id="stopScanBtn" class="btn btn-secondary btn-sm" onclick="stopScan()" style="display:none">⏹️ Stop</button>
          <div class="scan-status"><span class="dot" id="scanDot"></span><span id="scanStatus">Idle — click Start</span></div>
        </div>
        <div id="oppsList"></div>
      </div>
    </div>

    <!-- PAYMENTS TAB -->
    <div id="tab-payments" class="tab-panel" style="display:none">
      <div class="card">
        <h2>Subscribe</h2>
        <p style="font-size:.85rem;color:var(--muted);margin-bottom:8px">Select a plan and pay with M-Pesa (via PayHero STK Push).</p>
        <div class="plans" id="plansGrid"></div>
        <button class="btn btn-primary" id="payBtn" onclick="startPayment()" disabled>Pay with M-Pesa</button>
        <div class="pay-status" id="payStatus"></div>
      </div>

      <div class="card">
        <h2>Recent Transactions</h2>
        <div id="txList"><p style="font-size:.85rem;color:var(--muted)">No transactions yet.</p></div>
      </div>
    </div>

    <!-- MESSAGES TAB -->
    <div id="tab-messages" class="tab-panel" style="display:none">
      <div class="card">
        <h2>Support Chat</h2>
        <div id="messagesList"></div>
        <div class="msg-input-row">
          <input id="newMsg" type="text" placeholder="Type a message…" />
          <button class="btn btn-primary btn-sm" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-panel" style="display:none">
      <div class="card">
        <h2>Change Password</h2>
        <div class="field"><label>Current Password</label><input id="cpCurrent" type="password" /></div>
        <div class="field"><label>New Password</label><input id="cpNew" type="password" /></div>
        <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
      </div>
      <div class="card">
        <h2>Change M-Pesa Number</h2>
        <div class="field"><label>New M-Pesa</label><input id="cmMpesa" type="tel" /></div>
        <div class="field"><label>Password</label><input id="cmPw" type="password" /></div>
        <button class="btn btn-primary" onclick="changeMpesa()">Update M-Pesa</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ============ Globals ============
let TOKEN = localStorage.getItem('arbimine_token') || '';
let ME = null;
let SELECTED_PLAN = null;
let PLANS = null;
let POLL_INTERVAL = null;

// ============ Helpers ============
const $ = id => document.getElementById(id);
function toast(msg, type='') {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 3000);
}
async function api(path, method='GET', body=null, auth=true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && TOKEN) headers['Authorization'] = TOKEN;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  let data = {};
  try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ============ Auth ============
function switchAuth(which) {
  $('tabLogin').classList.toggle('active', which === 'login');
  $('tabRegister').classList.toggle('active', which === 'register');
  $('loginForm').style.display = which === 'login' ? 'block' : 'none';
  $('registerForm').style.display = which === 'register' ? 'block' : 'none';
  $('authMsg').className = 'msg';
}
function showAuthMsg(text, type) {
  const m = $('authMsg');
  m.textContent = text; m.className = 'msg show ' + type;
}
async function doRegister() {
  try {
    const username = $('regUser').value.trim();
    const email = $('regEmail').value.trim();
    const mpesa = $('regMpesa').value.trim().replace(/\D/g, '');
    const password = $('regPw').value;
    if (!username || !email || !mpesa || !password) return showAuthMsg('All fields required', 'error');
    const d = await api('/api/register', 'POST', { username, email, mpesa, password }, false);
    TOKEN = d.token;
    localStorage.setItem('arbimine_token', TOKEN);
    showAuthMsg('Account created!', 'success');
    setTimeout(bootApp, 500);
  } catch (err) { showAuthMsg(err.message, 'error'); }
}
async function doLogin() {
  try {
    const identifier = $('loginId').value.trim();
    const password = $('loginPw').value;
    if (!identifier || !password) return showAuthMsg('Both fields required', 'error');
    const d = await api('/api/login', 'POST', { identifier, password }, false);
    TOKEN = d.token;
    localStorage.setItem('arbimine_token', TOKEN);
    showAuthMsg('Welcome back!', 'success');
    setTimeout(bootApp, 400);
  } catch (err) { showAuthMsg(err.message, 'error'); }
}
async function doLogout() {
  try { await api('/api/logout', 'POST'); } catch {}
  TOKEN = ''; localStorage.removeItem('arbimine_token');
  location.reload();
}

// ============ App boot ============
async function bootApp() {
  if (!TOKEN) return;
  try {
    ME = await api('/api/me');
  } catch { localStorage.removeItem('arbimine_token'); TOKEN=''; return; }

  $('authScreen').style.display = 'none';
  $('app').style.display = 'block';
  $('welcomeUser').textContent = 'Hi, ' + ME.username;

  await Promise.all([loadSubscription(), loadTransactions(), loadMessages(), loadScanStatus()]);
}

function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  $('tab-' + name).style.display = 'block';
  document.querySelector('.tab[data-tab="'+name+'"]').classList.add('active');
}

// ============ Subscription ============
async function loadSubscription() {
  try {
    const s = await api('/api/user/subscription');
    PLANS = s.plans;
    const bar = $('subBar');
    if (s.active) {
      const exp = new Date(s.expiresAt).toLocaleDateString();
      bar.className = 'sub-bar active';
      bar.textContent = `✅ Active (${s.plan}) — expires ${exp}`;
    } else {
      bar.className = 'sub-bar inactive';
      bar.textContent = '⚠️ No active subscription — subscribe below';
    }
    renderPlans();
  } catch (err) { console.error(err); }
}
function renderPlans() {
  const grid = $('plansGrid');
  if (!PLANS) return;
  const names = { threeDay: '3 Days', weekly: 'Weekly', monthly: 'Monthly' };
  grid.innerHTML = '';
  for (const key of ['threeDay','weekly','monthly']) {
    const p = PLANS[key];
    if (!p) continue;
    const div = document.createElement('div');
    div.className = 'plan';
    div.dataset.plan = key;
    div.innerHTML = `<h3>${names[key]}</h3><div class="price">KES ${p.amount}</div><div class="dur">${p.duration} days</div>`;
    div.onclick = () => {
      SELECTED_PLAN = key;
      document.querySelectorAll('.plan').forEach(x => x.classList.remove('selected'));
      div.classList.add('selected');
      $('payBtn').disabled = false;
    };
    grid.appendChild(div);
  }
}

// ============ Payment flow ============
async function startPayment() {
  if (!SELECTED_PLAN) return toast('Select a plan first', 'error');
  const ps = $('payStatus');
  ps.className = 'pay-status show pending';
  ps.innerHTML = '<div class="title">📱 Sending STK push…</div>Check your phone and enter your M-Pesa PIN.';
  $('payBtn').disabled = true;

  try {
    const d = await api('/api/payhero/initialize', 'POST', { plan: SELECTED_PLAN });
    const reference = d.reference;
    toast('STK push sent — check your phone', 'success');
    pollPayment(reference);
  } catch (err) {
    ps.className = 'pay-status show failed';
    ps.innerHTML = `<div class="title">❌ Failed to send</div>${err.message}`;
    $('payBtn').disabled = false;
  }
}

function pollPayment(reference) {
  if (POLL_INTERVAL) clearInterval(POLL_INTERVAL);
  let attempts = 0;
  POLL_INTERVAL = setInterval(async () => {
    attempts++;
    try {
      const s = await api('/api/payment/status/' + reference);
      const ps = $('payStatus');
      if (s.status === 'success') {
        clearInterval(POLL_INTERVAL); POLL_INTERVAL = null;
        ps.className = 'pay-status show success';
        ps.innerHTML = `<div class="title">✅ Payment Successful</div>Your ${s.plan} subscription is now active.`;
        toast('Payment successful', 'success');
        loadSubscription(); loadTransactions();
        $('payBtn').disabled = false;
      } else if (s.status === 'failed') {
        clearInterval(POLL_INTERVAL); POLL_INTERVAL = null;
        ps.className = 'pay-status show failed';
        ps.innerHTML = `<div class="title">❌ Payment Failed</div>Reason: <strong>${s.reason || 'Unknown'}</strong>`;
        toast('Payment failed: ' + (s.reason || ''), 'error');
        loadTransactions();
        $('payBtn').disabled = false;
      } else {
        // still pending
        ps.className = 'pay-status show pending';
        ps.innerHTML = `<div class="title">⏳ Waiting for you to complete payment…</div>Check your phone and enter M-Pesa PIN. (${attempts})`;
      }
      if (attempts > 60) { // ~3 minutes
        clearInterval(POLL_INTERVAL); POLL_INTERVAL = null;
        ps.className = 'pay-status show failed';
        ps.innerHTML = '<div class="title">❌ Timed out</div>No response from M-Pesa. Please try again.';
        $('payBtn').disabled = false;
      }
    } catch (err) {
      console.error('Poll error:', err);
    }
  }, 3000);
}

async function loadTransactions() {
  try {
    const d = await api('/api/transactions');
    const list = $('txList');
    if (!d.transactions?.length) {
      list.innerHTML = '<p style="font-size:.85rem;color:var(--muted)">No transactions yet.</p>';
      return;
    }
    list.innerHTML = d.transactions.map(tx => {
      const badge = tx.status === 'success' ? 'success' : tx.status === 'failed' ? 'failed' : 'pending';
      const reason = tx.status === 'failed' && tx.failureReason
        ? `<div class="reason">⚠ ${escapeHtml(tx.failureReason)}</div>` : '';
      const date = new Date(tx.createdAt).toLocaleString();
      return `<div class="tx">
        <div class="tx-top">
          <span><strong>${escapeHtml(tx.plan)}</strong> • KES ${tx.amount}</span>
          <span class="badge ${badge}">${tx.status}</span>
        </div>
        <div class="tx-ref">${escapeHtml(tx.reference)}</div>
        <div class="tx-ref">${date}</div>
        ${reason}
      </div>`;
    }).join('');
  } catch (err) { console.error(err); }
}

// ============ Scanning ============
async function loadScanStatus() {
  try {
    const s = await api('/api/scan/status');
    setScanUI(s.scanning);
    if (s.scanning) loadOpportunities();
  } catch {}
}
function setScanUI(scanning) {
  $('startScanBtn').style.display = scanning ? 'none' : 'inline-flex';
  $('stopScanBtn').style.display = scanning ? 'inline-flex' : 'none';
  $('scanDot').className = 'dot' + (scanning ? ' live' : '');
  $('scanStatus').textContent = scanning ? 'Scanning live…' : 'Idle — click Start';
}
async function startScan() {
  try {
    await api('/api/scan/start', 'POST');
    setScanUI(true); toast('Scanning started', 'success');
    loadOpportunities();
    // refresh every 30s
    window._oppTimer = setInterval(loadOpportunities, 30000);
  } catch (err) { toast(err.message, 'error'); }
}
async function stopScan() {
  try {
    await api('/api/scan/stop', 'POST');
    setScanUI(false); toast('Scanning stopped');
    if (window._oppTimer) clearInterval(window._oppTimer);
  } catch (err) { toast(err.message, 'error'); }
}

async function loadOpportunities() {
  try {
    const d = await api('/api/opportunities');
    const list = $('oppsList');
    if (!d.opportunities?.length) {
      list.innerHTML = '<p style="font-size:.85rem;color:var(--muted);text-align:center;padding:20px">No opportunities found yet. Scanner may still be loading markets (this can take 30-60s on first start).</p>';
      return;
    }
    list.innerHTML = d.opportunities.slice(0, 20).map(o => `
      <div class="opp">
        <div class="opp-top">
          <span class="opp-symbol">${escapeHtml(o.symbol)}</span>
          <span class="spread">+${escapeHtml(o.spread)}%</span>
        </div>
        <div class="opp-route">
          Buy on <span class="ex">${escapeHtml(o.buyExchange)}</span> @ $${escapeHtml(o.buyPrice)}
          → Sell on <span class="ex">${escapeHtml(o.sellExchange)}</span> @ $${escapeHtml(o.sellPrice)}
        </div>
        <div class="opp-meta">
          <span>💧 Liquidity: $${Number(o.liquidity).toLocaleString()}</span>
          <span>🎯 Risk: ${escapeHtml(o.risk || 'medium')}</span>
          ${o.tradable ? '<span style="color:var(--success)">✅ Tradable</span>' : ''}
        </div>
        ${o.aiSummary ? `<div class="opp-ai"><strong>AI ${o.aiScore}/100 (${o.aiRisk}):</strong> ${escapeHtml(o.aiRecommendation)} — ${escapeHtml(o.aiSummary)}</div>` : ''}
      </div>
    `).join('');
  } catch (err) { console.error(err); }
}

// ============ Messages ============
async function loadMessages() {
  try {
    const msgs = await api('/api/messages');
    const list = $('messagesList');
    if (!msgs?.length) {
      list.innerHTML = '<p style="font-size:.85rem;color:var(--muted)">No messages yet.</p>';
      return;
    }
    list.innerHTML = msgs.map(m => `
      <div class="msg-item ${m.isAdmin ? 'admin' : 'user'}">
        <div>${escapeHtml(m.content)}</div>
        <div class="meta">${m.isAdmin ? 'Admin' : 'You'} • ${new Date(m.createdAt).toLocaleString()}</div>
      </div>
    `).join('');
  } catch (err) { console.error(err); }
}
async function sendMessage() {
  const content = $('newMsg').value.trim();
  if (!content) return;
  try {
    await api('/api/messages', 'POST', { content });
    $('newMsg').value = '';
    loadMessages();
  } catch (err) { toast(err.message, 'error'); }
}

// ============ Settings ============
async function changePassword() {
  try {
    const currentPassword = $('cpCurrent').value;
    const newPassword = $('cpNew').value;
    if (!currentPassword || !newPassword) return toast('Both fields required', 'error');
    await api('/api/user/change-password', 'POST', { currentPassword, newPassword });
    toast('Password updated', 'success');
    $('cpCurrent').value = ''; $('cpNew').value = '';
  } catch (err) { toast(err.message, 'error'); }
}
async function changeMpesa() {
  try {
    const newMpesa = $('cmMpesa').value.trim().replace(/\D/g, '');
    const password = $('cmPw').value;
    if (!newMpesa || !password) return toast('Both fields required', 'error');
    await api('/api/user/change-mpesa', 'POST', { newMpesa, password });
    toast('M-Pesa updated', 'success');
    $('cmMpesa').value = ''; $('cmPw').value = '';
  } catch (err) { toast(err.message, 'error'); }
}

// ============ Utils ============
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ============ Init ============
bootApp();
</script>
</body>
  </html>
